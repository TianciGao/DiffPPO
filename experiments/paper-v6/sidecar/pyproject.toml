[build-system]
requires = ["uv_build==0.12.0"]
build-backend = "uv_build"

[project]
name = "ppo-dap-legacy-sidecar"
version = "0.0.0"
description = "Isolated legacy-environment sidecar protocol for PPO-DAP experiments"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
dependencies = []

[tool.uv]
required-version = "==0.12.0"
python-downloads = "manual"
prerelease = "disallow"

[tool.uv.build-backend]
module-name = "ppo_dap_legacy_sidecar"

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
