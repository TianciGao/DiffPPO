[build-system]
requires = ["uv_build==0.12.0"]
build-backend = "uv_build"

[project]
name = "ppo-dap"
version = "0.1.0"
description = "Clean-room, theory-anchored PPO-DAP implementation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.13.0",
]

[project.urls]
Repository = "https://github.com/TianciGao/DiffPPO"
Issues = "https://github.com/TianciGao/DiffPPO/issues"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "PyYAML==6.0.3",
    "ruff==0.16.1",
]

[tool.uv]
required-version = "==0.12.0"
python-preference = "system"
python-downloads = "manual"
prerelease = "disallow"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
